name: NINTH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run auth:generate
      - run: npm run build
      - run: >-
          node --test --test-force-exit
          server/src/domain/markets.test.js
          server/src/services/oddsProvider.test.js
          server/src/services/oddsHistoryStore.test.js
          server/src/services/multiSportProvider.test.js
          server/src/services/modelArtifactSigner.test.js

  model-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest
          ml.test_model_release
          ml.test_maintenance
          ml.test_refresh_player_prop_policy
          stats-service/test_projection_integrity.py
